# Azure DevOps pipeline: export Boomi components (live) and scan with SonarQube.
#
# Runs on a self-hosted agent (the arm64 Podman agent) that has jq, curl, xmllint
# and sonar-scanner, and can reach the SonarQube container on the boomi-ci network.
#
# Required variable groups (Pipelines -> Library):
#   boomicicd        -> authToken (secret), baseURL
#   boomi-sonar      -> sonarHostURL, sonarToken (secret), sonarProjectKey
# Set componentIds at queue time (or make it a variable).

trigger: none            # run manually / on demand for the test environment

parameters:
  - name: componentIds
    displayName: 'Comma-separated Boomi component IDs to scan'
    type: string
    default: ''
  - name: semgrepFailOn
    displayName: 'Fail the build on Semgrep findings of this level (report-only if none)'
    type: string
    default: 'none'
    values: ['none', 'error', 'warning']
  - name: semgrepExtraConfig
    displayName: 'Extra Semgrep configs to layer on (registry packs, space-separated; needs registry access)'
    type: string
    default: ''
  - name: includeSampleFindings
    displayName: 'Also scan the bundled vulnerable sample scripts (demo: guarantees Semgrep findings)'
    type: boolean
    default: false

pool:
  name: 'Default'        # must match the self-hosted agent pool (see test-env/README.md)

variables:
  - group: boomicicd     # authToken (secret), baseURL
  - group: boomi-sonar   # sonarHostURL, sonarToken (secret), sonarProjectKey
  - name: SCRIPTS_HOME
    value: $(Build.SourcesDirectory)/cli/scripts
  - name: WORKSPACE
    value: $(Build.SourcesDirectory)/workspace

steps:
  - checkout: self

  - script: |
      set -e
      mkdir -p "$(WORKSPACE)"
      chmod +x "$(SCRIPTS_HOME)"/bin/*.sh
      chmod +x "$(Build.SourcesDirectory)"/ci-templates/azuredevops/pipelines/*.sh
      echo "Tooling versions:"; bash --version | head -1; jq --version; xmllint --version 2>&1 | head -1; sonar-scanner --version | tail -1; semgrep --version
    displayName: 'Prepare environment'

  - script: |
      bash "$(Build.SourcesDirectory)/ci-templates/azuredevops/pipelines/sonar_scan_boomi.sh"
    displayName: 'Export, extract scripts, Semgrep SAST + SonarQube scan'
    env:
      authToken: $(authToken)
      baseURL: $(baseURL)
      componentIds: ${{ parameters.componentIds }}
      sonarHostURL: $(sonarHostURL)
      sonarToken: $(sonarToken)
      sonarProjectKey: $(sonarProjectKey)
      SEMGREP_FAIL_ON: ${{ parameters.semgrepFailOn }}
      SEMGREP_EXTRA_CONFIG: ${{ parameters.semgrepExtraConfig }}
      INCLUDE_SAMPLE_FINDINGS: ${{ parameters.includeSampleFindings }}
      SCRIPTS_HOME: $(SCRIPTS_HOME)
      WORKSPACE: $(WORKSPACE)

  - publish: $(WORKSPACE)/boomi-scan
    artifact: boomi-scan
    displayName: 'Publish scan artifacts (Semgrep SARIF + extracted scripts)'
    condition: always()
