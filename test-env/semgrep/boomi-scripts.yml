# Semgrep ruleset for scripts extracted from Boomi components (Groovy / JavaScript).
#
# Boomi Data Process / Scripting shapes embed Groovy or JS. Groovy is not a
# first-class Semgrep language, so those rules use `generic` (token/regex) mode —
# high-signal for the common anti-patterns, not full data-flow taint. JavaScript
# rules can be AST-aware. Extend with the Semgrep registry when it is reachable:
#   semgrep --config test-env/semgrep/boomi-scripts.yml --config p/security-audit --config p/secrets
#
# Covered: hardcoded credentials, OS command injection, SQL injection (string
# concat), XXE (unhardened XML parsers), weak crypto, disabled TLS verification,
# and JS eval/dynamic-code execution.

rules:
  - id: boomi-hardcoded-credential
    languages: [generic]
    severity: ERROR
    message: >
      Possible hardcoded credential/secret in a Boomi script. Store secrets in
      environment extensions / a secret manager and mark connection fields extensible.
    metadata: { cwe: "CWE-798", owasp: "A07:2021" }
    paths:
      include: ["*.groovy", "*.js"]
    patterns:
      - pattern-regex: (?i)\b(password|passwd|pwd|secret|apikey|api_key|access_key|token|private_key)\b\s*[:=]\s*["'][^"']{3,}["']

  - id: boomi-os-command-execution
    languages: [generic]
    severity: ERROR
    message: >
      OS command execution in a Boomi script. If any part of the command is derived
      from document data/properties this is command injection (CWE-78).
    metadata: { cwe: "CWE-78", owasp: "A03:2021" }
    paths:
      include: ["*.groovy", "*.js"]
    patterns:
      - pattern-regex: (Runtime\.getRuntime\(\)\.exec|new\s+ProcessBuilder|\[[^\]]*\]\.execute\(\)|child_process|\.exec\s*\()

  - id: boomi-sql-injection-concat
    languages: [generic]
    severity: ERROR
    message: >
      SQL statement built by string concatenation. Use parameterized queries
      (Groovy Sql.rows(query, params)) instead of concatenating document data.
    metadata: { cwe: "CWE-89", owasp: "A03:2021" }
    paths:
      include: ["*.groovy", "*.js"]
    patterns:
      - pattern-regex: (?i)(select|insert|update|delete)\s+.*["']\s*\+\s*\w

  - id: boomi-xxe-unhardened-xml-parser
    languages: [generic]
    severity: ERROR
    message: >
      XML parsed without disabling external entities / DOCTYPE (XXE, CWE-611).
      For XmlSlurper/XmlParser set FEATURE_SECURE_PROCESSING and disallow-doctype-decl;
      for DocumentBuilderFactory/SAXParserFactory disable external entities.
    metadata: { cwe: "CWE-611", owasp: "A05:2021" }
    paths:
      include: ["*.groovy", "*.js"]
    patterns:
      - pattern-regex: (new\s+XmlSlurper\s*\(\s*\)|new\s+XmlParser\s*\(\s*\)|DocumentBuilderFactory\.newInstance|SAXParserFactory\.newInstance|XMLInputFactory\.newInstance)

  - id: boomi-weak-crypto
    languages: [generic]
    severity: WARNING
    message: "Weak/broken cryptographic primitive (DES/RC4/MD5/SHA-1). Use AES-GCM / SHA-256+."
    metadata: { cwe: "CWE-327", owasp: "A02:2021" }
    paths:
      include: ["*.groovy", "*.js"]
    patterns:
      - pattern-regex: (?i)(getInstance\s*\(\s*["'](DES|DESede|RC4|ARCFOUR)["']|MessageDigest\.getInstance\s*\(\s*["'](MD5|SHA-?1)["'])

  - id: boomi-disabled-tls-verification
    languages: [generic]
    severity: ERROR
    message: "TLS certificate/hostname verification appears disabled (CWE-295)."
    metadata: { cwe: "CWE-295", owasp: "A07:2021" }
    paths:
      include: ["*.groovy", "*.js"]
    patterns:
      - pattern-regex: (?i)(TrustAllCerts|X509TrustManager|ALLOW_ALL_HOSTNAME_VERIFIER|setHostnameVerifier|checkServerTrusted\s*\([^)]*\)\s*\{\s*\}|rejectUnauthorized\s*[:=]\s*false)

  - id: boomi-js-dynamic-code-execution
    languages: [javascript]
    severity: ERROR
    message: "Dynamic code execution (eval / Function). Untrusted input here is code injection / XSS (CWE-95)."
    metadata: { cwe: "CWE-95", owasp: "A03:2021" }
    paths:
      include: ["*.js"]
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
