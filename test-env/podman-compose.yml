# Boomi CICD — SonarQube test environment (Podman, arm64-native)
#
# Brings up SonarQube Community + its mandatory Postgres backend on a shared
# network `boomi-ci`. The Azure DevOps agent runs separately (see agent/run-agent.sh)
# and joins the same network so it can reach SonarQube at http://boomi-sonarqube:9000.
#
# Prereq (run once per Podman VM boot — SonarQube's embedded Elasticsearch needs it):
#   podman machine ssh 'sudo sysctl -w vm.max_map_count=524288 fs.file-max=131072'
#
# Bring up:   podman compose -f test-env/podman-compose.yml up -d
# Status:     podman compose -f test-env/podman-compose.yml ps
# Logs:       podman logs -f boomi-sonarqube
# Tear down:  podman compose -f test-env/podman-compose.yml down        (keeps volumes)
#             podman compose -f test-env/podman-compose.yml down -v     (wipes data)

services:
  db:
    image: postgres:15
    container_name: boomi-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    networks:
      - boomi-ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 12

  sonarqube:
    image: sonarqube:community
    container_name: boomi-sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      # Host 9001 -> container 9000 (host :9000 was already in use on this machine).
      # The agent still reaches SonarQube at http://boomi-sonarqube:9000 over the network.
      - "9001:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - boomi-ci
    healthcheck:
      # SonarQube reports {"status":"UP"} once fully started (first boot ~2-4 min)
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

networks:
  boomi-ci:
    name: boomi-ci

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
